<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ResumeBuilder</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <!-- ========================================
         RESET PASSWORD PAGE
    ========================================= -->

    <div class="auth-page">

        <!-- Theme Toggle -->
        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            onclick="toggleTheme()"
        >
            🌙 Dark
        </button>


        <!-- ========================================
             AUTH CARD
        ========================================= -->

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                Resume<span>Builder</span>
            </div>


            <!-- Icon -->
            <div class="auth-icon">
                🔐
            </div>


            <!-- Heading -->
            <h1>Reset Password</h1>


            <p class="auth-subtitle">
                Enter your new password below.
            </p>


            <!-- ========================================
                 MESSAGE
            ========================================= -->

            <div id="message"></div>


            <!-- ========================================
                 FORM
            ========================================= -->

            <form id="resetPasswordForm">

                <!-- New Password -->

                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    id="resetPasswordBtn"
                    class="auth-btn"
                >
                    🔑 Reset Password
                </button>

            </form>


            <!-- Back to Login -->

            <a
                href="login.html"
                class="back-home"
            >
                ← Back to Login
            </a>

        </div>

    </div>


    <!-- ========================================
         MAIN JAVASCRIPT
    ========================================= -->

    <script src="js/script.js"></script>


    <!-- ========================================
         RESET PASSWORD JAVASCRIPT
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const form =
                    document.getElementById(
                        "resetPasswordForm"
                    );

                const newPasswordInput =
                    document.getElementById(
                        "newPassword"
                    );

                const confirmPasswordInput =
                    document.getElementById(
                        "confirmPassword"
                    );

                const messageBox =
                    document.getElementById(
                        "message"
                    );

                const button =
                    document.getElementById(
                        "resetPasswordBtn"
                    );


                // ========================================
                // GET TOKEN FROM URL
                // ========================================

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );

                const token =
                    urlParams.get("token");


                console.log(
                    "Reset token:",
                    token
                );


                // ========================================
                // TOKEN CHECK
                // ========================================

                if (!token) {

                    messageBox.innerHTML =
                        '<div class="error-message">' +
                        '❌ Invalid or missing reset token.' +
                        '</div>';

                    button.disabled = true;

                    return;
                }


                // ========================================
                // FORM SUBMIT
                // ========================================

                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const newPassword =
                            newPasswordInput.value;

                        const confirmPassword =
                            confirmPasswordInput.value;


                        // ========================================
                        // PASSWORD CHECK
                        // ========================================

                        if (
                            newPassword.length < 6
                        ) {

                            messageBox.innerHTML =
                                '<div class="error-message">' +
                                '❌ Password must be at least 6 characters.' +
                                '</div>';

                            return;
                        }


                        // ========================================
                        // CONFIRM PASSWORD CHECK
                        // ========================================

                        if (
                            newPassword !== confirmPassword
                        ) {

                            messageBox.innerHTML =
                                '<div class="error-message">' +
                                '❌ Passwords do not match.' +
                                '</div>';

                            return;
                        }


                        // ========================================
                        // LOADING
                        // ========================================

                        button.disabled = true;

                        button.textContent =
                            "⏳ Resetting...";


                        messageBox.innerHTML =
                            '<div class="success-message">' +
                            '⏳ Resetting your password...' +
                            '</div>';


                        try {

                            console.log(
                                "Sending reset password request..."
                            );


                            // ========================================
                            // API REQUEST
                            // ========================================

                            const response =
                                await fetch(
                                    "http://localhost:8080/api/auth/reset-password",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                token:
                                                    token,

                                                newPassword:
                                                    newPassword
                                            })
                                    }
                                );


                            console.log(
                                "Reset password status:",
                                response.status
                            );


                            // ========================================
                            // RESPONSE
                            // ========================================

                            let data = {};

                            try {

                                data =
                                    await response.json();

                            } catch (jsonError) {

                                console.error(
                                    "Response JSON error:",
                                    jsonError
                                );

                            }


                            console.log(
                                "Reset password response:",
                                data
                            );


                            // ========================================
                            // ERROR
                            // ========================================

                            if (!response.ok) {

                                throw new Error(
                                    data.message ||
                                    "Password reset failed."
                                );
                            }


                            // ========================================
                            // SUCCESS
                            // ========================================

                            messageBox.innerHTML =
                                '<div class="success-message">' +
                                '✅ ' +
                                (
                                    data.message ||
                                    "Password reset successfully."
                                ) +
                                '</div>';


                            // Clear inputs

                            newPasswordInput.value = "";

                            confirmPasswordInput.value = "";


                            // ========================================
                            // REDIRECT TO LOGIN
                            // ========================================

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "login.html";

                                },
                                2000
                            );


                        } catch (error) {

                            console.error(
                                "Reset password error:",
                                error
                            );


                            messageBox.innerHTML =
                                '<div class="error-message">' +
                                '❌ ' +
                                (
                                    error.message ||
                                    "Something went wrong."
                                ) +
                                '</div>';


                        } finally {

                            button.disabled = false;

                            button.textContent =
                                "🔑 Reset Password";

                        }

                    }
                );

            }

        );

    </script>

</body>

</html>
