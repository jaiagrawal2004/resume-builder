<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ResumeBuilder</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="auth-page">

    <!-- LEFT -->

    <section class="auth-left">

        <div class="auth-content">

            <div class="logo">
                ResumeBuilder
            </div>

            <h1>
                Build a Resume That Gets You Hired.
            </h1>

            <p>
                Create professional resumes, improve your ATS score,
                and stand out from the competition.
            </p>

        </div>

    </section>


    <!-- RIGHT -->

    <section class="auth-right">

        <div class="auth-card">

            <h2>Welcome Back 👋</h2>

            <p class="auth-subtitle">
                Login to your ResumeBuilder account.
            </p>

            <div id="message" class="message"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <a
                    href="forgot-password.html"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a
                    href="register.html"
                    class="auth-link"
                >
                    Create Account
                </a>

            </div>

        </div>

    </section>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
