<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - ResumeBuilder</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- ========================================
         AUTH PAGE
    ========================================= -->

    <div class="auth-page">

        <!-- Theme Toggle -->
        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            onclick="toggleTheme()"
        >
            🌙 Dark
        </button>


        <!-- ========================================
             AUTH CARD
        ========================================= -->

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                Resume<span>Builder</span>
            </div>


            <!-- Icon -->
            <div class="auth-icon">
                🔐
            </div>


            <!-- Heading -->
            <h1>Forgot Password?</h1>

            <p class="auth-subtitle">
                Enter your email address and we'll help you reset your password.
            </p>


            <!-- ========================================
                 MESSAGE
            ========================================= -->

            <div id="message"></div>


            <!-- ========================================
                 FORGOT PASSWORD FORM
            ========================================= -->

            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="forgotPasswordBtn"
                    class="auth-btn"
                >
                    📧 Send Reset Link
                </button>

            </form>


            <!-- Back to Login -->
            <a
                href="login.html"
                class="back-home"
            >
                ← Back to Login
            </a>

        </div>

    </div>


    <!-- ========================================
         MAIN JAVASCRIPT
    ========================================= -->

    <script src="js/script.js"></script>


    <!-- ========================================
         FORGOT PASSWORD JAVASCRIPT
    ========================================= -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const form =
                document.getElementById("forgotPasswordForm");

            const emailInput =
                document.getElementById("forgotEmail");

            const messageBox =
                document.getElementById("message");

            const button =
                document.getElementById("forgotPasswordBtn");


            // ----------------------------------------
            // Check elements
            // ----------------------------------------

            if (!form) {
                console.error(
                    "ERROR: forgotPasswordForm not found."
                );
                return;
            }

            if (!emailInput) {
                console.error(
                    "ERROR: forgotEmail not found."
                );
                return;
            }

            if (!messageBox) {
                console.error(
                    "ERROR: message box not found."
                );
                return;
            }


            // ----------------------------------------
            // Form Submit
            // ----------------------------------------

            form.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    console.log(
                        "Forgot password form submitted."
                    );


                    // ----------------------------------------
                    // Get Email
                    // ----------------------------------------

                    const email =
                        emailInput.value.trim();


                    // ----------------------------------------
                    // Validate Email
                    // ----------------------------------------

                    if (!email) {

                        messageBox.innerHTML =
                            '<div class="error-message">' +
                            'Please enter your email address.' +
                            '</div>';

                        return;
                    }


                    // ----------------------------------------
                    // Disable Button
                    // ----------------------------------------

                    button.disabled = true;

                    button.textContent =
                        "⏳ Sending...";


                    // ----------------------------------------
                    // Show Loading
                    // ----------------------------------------

                    messageBox.innerHTML =
                        '<div class="success-message">' +
                        '⏳ Sending reset link...' +
                        '</div>';


                    try {

                        console.log(
                            "Sending forgot password request..."
                        );

                        console.log(
                            "Email:",
                            email
                        );


                        // ----------------------------------------
                        // API Request
                        // ----------------------------------------

                        const response =
                            await fetch(
                                "http://localhost:8080/api/auth/forgot-password",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email
                                        })
                                }
                            );


                        console.log(
                            "Response status:",
                            response.status
                        );


                        // ----------------------------------------
                        // Read Response
                        // ----------------------------------------

                        let data = {};

                        try {

                            data =
                                await response.json();

                        } catch (jsonError) {

                            console.error(
                                "Response JSON error:",
                                jsonError
                            );

                        }


                        console.log(
                            "Forgot password response:",
                            data
                        );


                        // ----------------------------------------
                        // Handle Error
                        // ----------------------------------------

                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Unable to send reset link."
                            );
                        }


                        // ----------------------------------------
                        // Success
                        // ----------------------------------------

                        messageBox.innerHTML =
                            '<div class="success-message">' +
                            '✅ ' +
                            (
                                data.message ||
                                "Password reset link has been sent to your email."
                            ) +
                            '</div>';


                        console.log(
                            "Forgot password request successful."
                        );


                        // Clear form

                        form.reset();


                    } catch (error) {

                        console.error(
                            "Forgot password error:",
                            error
                        );


                        messageBox.innerHTML =
                            '<div class="error-message">' +
                            '❌ ' +
                            (
                                error.message ||
                                "Something went wrong."
                            ) +
                            '</div>';

                    } finally {

                        // ----------------------------------------
                        // Enable Button
                        // ----------------------------------------

                        button.disabled = false;

                        button.textContent =
                            "📧 Send Reset Link";
                    }

                }
            );

        });

    </script>

</body>

</html>
